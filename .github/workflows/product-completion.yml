name: Product Completion Verification

on:
  pull_request:
  push:
    branches:
      - "ai/product-completion/**"

permissions:
  contents: read

jobs:
  regression-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regression policy test
        run: npm run test:regression
